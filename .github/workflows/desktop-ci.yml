name: Desktop Pet CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile application
        run: npm run build
      - name: Package desktop installer
        if: matrix.os != 'ubuntu-latest'
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload installer
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pumi-installer-${{ matrix.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
